name: Release

on:
  release:
    types:
      - published # reacts to releases and prereleases, but not their drafts

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Setup Java"
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 11
    - name: "Setup Clojure"
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
        lein: 2.12.0
    - name: Deploy to Clojars
      run: ./scripts/lein-modules do clean, deploy clojars
      env:
        CLOJARS_USERNAME: metosinci
        CLOJARS_PASSWORD: "${{ secrets.CLOJARS_DEPLOY_TOKEN }}"
