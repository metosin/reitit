name: testsuite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
  LEIN_VERSION: 2.12.0

jobs:
  build-clj:
    strategy:
      matrix:
        # Supported Java versions: LTS releases and latest
        jdk: [11, 17, 21, 25]
        clojure: [11, 12]

    name: Clojure ${{ matrix.clojure }} (Java ${{ matrix.jdk }})

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-clj-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-clj-

    - name: Setup Java ${{ matrix.jdk }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.jdk }}

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        lein: ${{ env.LEIN_VERSION }}
        clj-kondo: 2026.10.26

    # Install openapi-schema-validator for openapi-tests
    # Uses node version from the ubuntu-latest
    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: ./lint.sh

    - name: Run tests
      run: ./scripts/test.sh clj${{ matrix.clojure }}

  build-cljs:
    name: ClojureScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-cljs-${{ hashFiles('**/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: ./scripts/test.sh cljs

  build-bb:
    name: Babashka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-bb-${{ hashFiles('bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-bb-

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: latest

      - name: Run tests
        run: ./scripts/test.sh bb

  test-docs:
    name: Documentation examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-docs-${{ hashFiles('**/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-docs-

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Run doc tests
        run: lein test-docs

  lint:
    name: Lint cljdoc.edn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same check as cljdoc's script/verify-cljdoc-edn, inlined to avoid
      # piping a script from the cljdoc master branch into bash.
      # Like the original, a :file line where no path is found fails.
      - name: Verify cljdoc.edn
        run: |
          fail=0
          while IFS= read -r line; do
            f=$(printf '%s\n' "$line" | sed -nE 's/.*:file[[:space:]]+"([^"]+)".*/\1/p')
            if [ -z "$f" ]; then
              echo "::error file=doc/cljdoc.edn::No file path found on line: $line"
              fail=1
            elif [ ! -f "$f" ]; then
              echo "::error file=doc/cljdoc.edn::$f is referenced in cljdoc.edn but not present"
              fail=1
            fi
          done < <(grep ':file' doc/cljdoc.edn)
          exit $fail

  check-cljdoc:
    name: Check cljdoc analysis
    runs-on: ubuntu-latest
    # Analysis logs are printed at the end, so don't wait 6h on a hang.
    timeout-minutes: 30
    env:
      # Pinned so a new analyzer release can't change CI without a commit here.
      # Also part of the cache key, so a bump caches the new analyzer deps.
      CLJDOC_ANALYZER_TAG: v1.0.937
      CLJDOC_ANALYZER_SHA: e67c8101106ebc0c4061801bb7f5b142bb779209
      # Each analysis uses more than one core, 4 at once on a 4 vCPU runner
      # made every module ~2x slower.
      CLJDOC_CHECK_JOBS: 2
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-cljdoc-${{ env.CLJDOC_ANALYZER_TAG }}-${{ hashFiles('**/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-cljdoc-

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: ${{ env.LEIN_VERSION }}
          cli: 1.12.7.1681

      - name: Install cljdoc analyzer
        run: clojure -Ttools install io.github.cljdoc/cljdoc-analyzer "{:git/tag \"$CLJDOC_ANALYZER_TAG\" :git/sha \"$CLJDOC_ANALYZER_SHA\"}" :as cljdoc-analyzer

      - name: CljDoc Check
        run: ./scripts/cljdoc-check.sh
